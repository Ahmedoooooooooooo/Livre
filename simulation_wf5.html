<!DOCTYPE html>
<html lang="fr">
<head>

<title>Simulation WF5 — Génération Mensuelle Livre&Vous</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1117;color:#e2e8f0;height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{background:#1a1d27;border-bottom:1px solid #2d3748;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}

.badge{background:#4f46e5;color:white;font-size:10px;padding:2px 8px;border-radius:12px}
.subtitle{margin-left:auto;font-size:11px;color:#6b7280}
.layout{display:grid;grid-template-columns:260px 1fr;flex:1;overflow:hidden}

/* Sidebar */
.sidebar{background:#13161f;border-right:1px solid #2d3748;overflow-y:auto;padding:8px 0}
.step-item{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;border-left:3px solid transparent;transition:all .15s}
.step-item:hover{background:#1e2130}
.step-item.active{background:#1e2130;border-left-color:#4f46e5}
.step-item.done{opacity:.7}
.step-dot{width:8px;height:8px;border-radius:50%;background:#2d3748;flex-shrink:0}
.step-item.done .step-dot{background:#10b981}
.step-item.active .step-dot{background:#4f46e5;box-shadow:0 0 0 3px #4f46e522}
.step-meta{min-width:0}
.step-num{font-size:10px;color:#4b5563}
.step-title{font-size:12px;color:#9ca3af;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step-item.active .step-title{color:#c7d2fe}

/* Detail panel */
.detail{display:flex;flex-direction:column;overflow:hidden}
.node-header{background:#1a1d27;padding:16px 20px;border-bottom:1px solid #2d3748;flex-shrink:0}

.node-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.node-icon{font-size:22px}
.node-name{font-size:16px;font-weight:600}
.type-chip{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:500}
.t-trigger{background:#7c3aed22;color:#a78bfa;border:1px solid #7c3aed55}
.t-http{background:#0369a122;color:#38bdf8;border:1px solid #0369a155}
.t-code{background:#d9770622;color:#fb923c;border:1px solid #d9770655}
.t-ai{background:#05966922;color:#34d399;border:1px solid #05966955}
.t-wait{background:#92400e22;color:#fbbf24;border:1px solid #92400e55}
.t-if{background:#75197022;color:#e879f9;border:1px solid #75197055}
.t-email{background:#0f5a6b22;color:#67e8f9;border:1px solid #0f5a6b55}
.t-split{background:#1f2d1022;color:#86efac;border:1px solid #1f2d1055}
.status-pill{margin-left:auto;font-size:11px;display:flex;align-items:center;gap:5px}
.sdot{width:7px;height:7px;border-radius:50%}
.s-run .sdot{background:#4f46e5}
.s-done .sdot{background:#10b981}
.node-desc{font-size:12px;color:#9ca3af;line-height:1.5}

.tabs{display:flex;background:#13161f;border-bottom:1px solid #2d3748;flex-shrink:0}
.tab{padding:9px 16px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:none;color:#6b7280;border-bottom:2px solid transparent;transition:all .15s}
.tab:hover{color:#d1d5db}
.tab.active{color:#818cf8;border-bottom-color:#818cf8}

.block-title{color:#818cf8;font-weight:600;margin-bottom:8px;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
pre.code{font-family:'Courier New',monospace;font-size:11px;line-height:1.7;color:#d1d5db;white-space:pre-wrap;word-break:break-all}
.kw{color:#c084fc}.fn{color:#60a5fa}.str{color:#86efac}.cm{color:#4b5563;font-style:italic}.num{color:#fb923c}.ki{color:#f9a8d4}
.jk{color:#818cf8}.jv{color:#86efac}.jn{color:#fb923c}.jb{color:#f472b6}

.grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.card{background:#13161f;border:1px solid #2d3748;border-radius:6px;padding:10px;font-size:11px}

.tag-wait{background:#fbbf2422;color:#fbbf24;padding:1px 6px;border-radius:4px;font-size:10px}

.img-thumb .it-ok{font-size:16px}
.arrow{text-align:center;color:#374151;padding:6px 0;font-size:18px}
.prompt-box{background:#0d1117;border:1px solid #2d3748;border-radius:8px;padding:14px;font-family:'Courier New',monospace;font-size:11px;line-height:1.7;color:#d1d5db;max-height:320px;overflow-y:auto;white-space:pre-wrap}
.section-h{font-size:10px;font-weight:700;color:#4f46e5;letter-spacing:1px;margin:10px 0 4px;text-transform:uppercase}
.badge-count{background:#4f46e522;color:#818cf8;border:1px solid #4f46e555;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600}

/* Controls */
.controls{background:#1a1d27;border-top:1px solid #2d3748;padding:10px 20px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.ctl-info{font-size:11px;color:#6b7280;margin-right:auto}
.btn{padding:7px 14px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s}
.btn-sec{background:#2d3748;color:#d1d5db}.btn-sec:hover{background:#374151}
.btn-pri{background:#4f46e5;color:white}.btn-pri:hover{background:#4338ca}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-play{min-width:110px}
</style>
</head>

<header>

    out:`<div class="block" style="border-color:#10b98133"><div class="block-title" style="color:#10b981">✅ Exécution complète</div><pre class="code">L'email a été envoyé avec succès.
L'admin se connecte au dashboard et valide les livres.
WF2 prend le relais pour générer le PDF et commander l'impression Gelato.</pre></div>` }
];

// ─── JSON highlighter ─────────────────────────────────────────────────────────
function jh(obj) {
  return JSON.stringify(obj, null, 2)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"(.*?)":/g,'<span class="jk">"$1"</span>:')
    .replace(/: "(.*?)"/g,': <span class="jv">"$1"</span>')
    .replace(/: (\d+\.?\d*)/g,': <span class="jn">$1</span>')
    .replace(/: (true|false)/g,': <span class="jb">$1</span>');
}

// ─── State ────────────────────────────────────────────────────────────────────
let cur = 0, activeTab = 'input', playing = false, timer = null;

// ─── Render ───────────────────────────────────────────────────────────────────
function render() {
  const s = STEPS[cur], n = STEPS.length;
  document.getElementById('prog').style.width = ((cur+1)/n*100)+'%';
  document.getElementById('ni').textContent = s.icon;
  document.getElementById('nn').textContent = s.name;
  document.getElementById('nt').className = 'type-chip '+s.cls;
  document.getElementById('nt').textContent = s.type;
  document.getElementById('nd').textContent = s.desc;
  const done = cur === n-1;
  document.getElementById('sp').className = 'status-pill '+(done?'s-done':'s-run');
  document.getElementById('st').textContent = done?'Terminé':'En cours';
  document.getElementById('ci').textContent = `Étape ${cur+1} / ${n}`;
  document.getElementById('bp').disabled = cur === 0;
  document.getElementById('bn').disabled = cur === n-1;
  renderTab();
  buildSidebar();
}

function renderTab() {
  const s = STEPS[cur];
  const map = {input:s.inp, proc:s.proc, out:s.out};
  document.getElementById('body').innerHTML = map[activeTab] || '';
  ['input','proc','out'].forEach(t => {
    document.getElementById('t-'+t).classList.toggle('active', t===activeTab);
  });
  document.getElementById('body').scrollTop = 0;
}

function tab(t) { activeTab = t; renderTab(); }

function buildSidebar() {
  document.getElementById('sidebar').innerHTML = STEPS.map((s,i) => `
    <div class="step-item ${i<cur?'done':''} ${i===cur?'active':''}" onclick="goto(${i})">
      <div class="step-dot"></div>
      <div class="step-meta">
        <div class="step-num">Étape ${i+1}</div>
        <div class="step-title">${s.icon} ${s.name}</div>
      </div>
    </div>`).join('');
  const el = document.querySelector('.step-item.active');
  if (el) el.scrollIntoView({block:'nearest', behavior:'smooth'});
}

function goto(i) { cur = i; activeTab = 'input'; render(); }
function next() { if (cur < STEPS.length-1) { cur++; activeTab='input'; render(); } }
function prev() { if (cur > 0) { cur--; activeTab='input'; render(); } }

function togglePlay() {
  playing = !playing;
  document.getElementById('bpl').textContent = playing ? '⏸ Pause' : '▶ Lecture auto';
  if (playing) {
    timer = setInterval(() => {
      if (cur >= STEPS.length-1) { playing=false; clearInterval(timer); document.getElementById('bpl').textContent='▶ Lecture auto'; return; }
      next();
    }, 2200);
  } else {
    clearInterval(timer);
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
});

render();
</script>
</body>
